name: HindTechGroup Site Quality

on:
  push:
    branches: [main]
    paths:
      - 'View/**'
      - 'Assets/**'
      - 'Models/**'
      - 'Helper/**'
      - '.github/workflows/site-quality.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Audit local links and assets
        run: python Helper/site_audit.py
